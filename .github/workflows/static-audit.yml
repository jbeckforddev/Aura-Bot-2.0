name: Aura Bot - Auditoria estatica
on:
  push:
    branches: [test]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar analizador aislado
        run: npm install --prefix "$RUNNER_TEMP/aura-ts-parser" --no-save --ignore-scripts --no-package-lock --no-audit --no-fund typescript@5.9.3
      - name: Revisar archivos sin iniciar Aura Bot
        run: TYPESCRIPT_PATH="$RUNNER_TEMP/aura-ts-parser/node_modules/typescript/lib/typescript.js" AURA_AUDIT_REPORT="static-audit-report.json" node scripts/audit-static.cjs
      - name: Conservar auditoria aun si falla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-static-results
          path: static-audit-report.json
          if-no-files-found: warn
